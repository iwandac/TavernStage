name: TavernStage bug
description: Report a reproducible issue in this fork. Do not include secrets or private conversations.
title: '[Bug] '
body:
  - type: input
    id: revision
    attributes:
      label: TavernStage commit and environment
      description: Include Git SHA, OS and Node version; distinguish inherited ST UI from runtime work.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction, expected result and actual result
      description: Use synthetic character/chat data. Redact tokens, account identifiers and personal data.
    validations:
      required: true
